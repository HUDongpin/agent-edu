/* ---------------- home page only ---------------- */
.hero{padding:56px 0 40px;text-align:center}
.hero h1{font-size:clamp(30px,5.2vw,52px);line-height:1.1;margin:14px auto 0;max-width:19ch}
.hero h1 .soft{color:var(--ink-3);display:block}
.hero .lede{font-size:clamp(16px,1.9vw,19px);color:var(--ink-2);max-width:62ch;
  margin:20px auto 0}
.hero .acts{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.hero .free{margin-top:14px;font-size:13px;color:var(--ink-3);font-family:var(--mono)}
:root[lang="ar"] .hero .free{font-family:var(--sans)}

.sect{padding:44px 0}
.sect > h2{font-size:clamp(22px,3vw,30px);text-align:center}
.sect > .sub{text-align:center;max-width:56ch;margin:9px auto 0;color:var(--ink-3)}

/* ---- track cards ---- */
.tracks{display:grid;gap:18px;margin-top:30px;
  grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.track{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px;position:relative;overflow:hidden;
  transition:border-color .15s, transform .15s}
.track:hover{border-color:var(--brand);transform:translateY(-2px)}
.track::before{content:"";position:absolute;inset-block-start:0;inset-inline:0;height:4px;
  background:var(--tc,var(--brand))}
.track .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;color:var(--tc,var(--brand))}
:root[lang="ar"] .track .tag{letter-spacing:0;font-family:var(--sans)}
.track h3{font-size:21px;margin:6px 0 9px}
.track p{font-size:14.5px;margin:0 0 14px;flex:1 1 auto}
.track .meta{font-size:12.5px;color:var(--ink-3);font-family:var(--mono);margin-bottom:14px}
:root[lang="ar"] .track .meta{font-family:var(--sans)}
.track .num{position:absolute;inset-block-start:14px;inset-inline-end:16px;
  font-size:44px;font-weight:800;color:var(--tc,var(--brand));opacity:.11;line-height:1}

/* ---- outcomes ---- */
.grid2{display:grid;gap:16px;margin-top:28px;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.out{display:flex;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:16px}
.out .ico{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);font-size:17px}
.out h4{font-size:15px;margin:0 0 3px}
.out p{font-size:13.5px;margin:0}

.who{display:grid;gap:14px;margin-top:26px;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.who div{background:var(--bg-2);border:1px solid var(--line-2);border-radius:11px;padding:15px}
.who h4{font-size:14.5px;margin:0 0 3px}
.who p{font-size:13px;margin:0;color:var(--ink-3)}

/* ---- progress ---- */
.progwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;margin-top:24px}
.progbar{height:8px;background:var(--line-2);border-radius:999px;overflow:hidden;margin:14px 0 4px}
.progbar span{display:block;height:100%;background:var(--green);border-radius:999px;
  transition:width .4s ease}
.proglist{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px 18px;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.proglist li{font-size:13.5px;color:var(--ink-3);display:flex;gap:8px;align-items:baseline}
.proglist li.done{color:var(--ink)}
.proglist .tick{font-family:var(--mono);width:1.1em;flex:0 0 auto}
.proglist li.done .tick{color:var(--green)}

/* ---- faq ---- */
.faq{margin-top:24px;display:grid;gap:9px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:13px 16px}
.faq summary{font-weight:650;cursor:pointer;font-size:15px;list-style:none;
  display:flex;align-items:center;gap:9px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"＋";color:var(--brand);font-weight:700;flex:0 0 auto}
.faq details[open] summary::before{content:"−"}
.faq p{margin:9px 0 0;font-size:14px}
.faq summary:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
</style>

<script>
"use strict";
/* Progress, read from the same localStorage object the handbook and lab write. */
(function () {
  var PROG = "ae.progress";
  function read() { try { return JSON.parse(localStorage.getItem(PROG) || "{}"); } catch (e) { return {}; } }
  function sections() {
    try { return (localStorage.getItem("tch.seen") || "").split(",").filter(Boolean).length; }
    catch (e) { return 0; }
  }
  var ITEMS = [
    ["track.1.title", function () { var n = sections(); return n >= 6 ? n + "/11" : false; }],
    ["home.learn1",   function (p) { return !!p.play0; }],
    ["home.learn2",   function (p) { return p.evalBest ? p.evalBest + "/20" : false; }],
    ["track.3.title", function (p) { return !!p.part2; }]
  ];
  function paint() {
    var p = read();
    var states = ITEMS.map(function (it) {
      var v = it[1](p);
      return { label: I18N.t(it[0]), done: !!v, note: typeof v === "string" ? v : "" };
    });
    var n = states.filter(function (s) { return s.done; }).length;
    document.getElementById("progEmpty").hidden = n > 0;
    document.getElementById("progReal").hidden = n === 0;
    if (!n) return;
    document.getElementById("progCount").textContent =
      n + " " + I18N.t("ui.of") + " " + ITEMS.length;
    document.getElementById("progFill").style.width = (n / ITEMS.length * 100) + "%";
    var ul = document.getElementById("progList");
    ul.innerHTML = "";
    states.forEach(function (s) {
      var li = document.createElement("li");
      li.className = s.done ? "done" : "";
      li.innerHTML = '<span class="tick">' + (s.done ? "✓" : "○") + "</span><span></span>";
      li.lastChild.textContent = s.label + (s.note ? "  " + s.note : "");
      ul.appendChild(li);
    });
  }
  document.getElementById("progReset").addEventListener("click", function () {
    try { localStorage.removeItem(PROG); localStorage.removeItem("tch.seen"); } catch (e) {}
    paint();
  });
  window.onLangChange = paint;   // shell.js calls this after every apply()
  paint();
  window.addEventListener("focus", paint);
})();
</script>
