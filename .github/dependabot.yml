# Dependency updates as reviewable pull requests, so an advisory arrives as a
# diff the required checks already gate instead of sitting unseen: next@16.3.1
# carried a critical advisory for three weeks before anyone looked.
#
# The framework has its own group. AGENTS.md warns that this Next.js differs
# from the one most tooling expects, so a Next or React minor needs its docs
# read and should never ride along inside a batch of trivial patches. A bump
# that moves shipped bytes will fail transfer:check by design — run
# `npm run transfer:update` and commit the numbers so the cost is reviewable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native Go port: the JS compiler API is gone from the
      # package root, so typescript-eslint refuses to load (it supports >=7.1
      # only) and scripts/check-analytics.mjs, which is built on that API,
      # crashes — taking vercel-build with it. Measured in #32, closed for that
      # reason. Lift this once typescript-eslint ships >=7.1 support and the
      # checker moves to the unstable/* exports.
      - dependency-name: "typescript"
        versions: [">=7"]
      # ESLint 10 removed context.getFilename(), deprecated since 9.
      # eslint-config-next 16.3.5 bundles eslint-plugin-react 7.37.5, whose
      # React-version detection still calls it (lib/util/version.js:31), and
      # core-web-vitals sets react.version to "detect" — so every version-gated
      # rule throws before a single file is linted: react/display-name dies on
      # the first page.tsx and `npm run lint` lints nothing. Measured in #33,
      # closed for that reason. 7.37.5 is the highest version that exists
      # (published April 2025, eslint peer capped at ^9.7), so an overrides
      # entry cannot help either. Lift this when eslint-plugin-react publishes
      # ESLint 10 support (jsx-eslint/eslint-plugin-react#3977) or
      # eslint-config-next bundles a fixed plugin (vercel/next.js#89764).
      - dependency-name: "eslint"
        versions: [">=10"]
    groups:
      framework:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
