<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tool scope and revocation diagram</title>
  <desc id="desc">An original course diagram places a connector behind separate read, write, inherited-access, logging, and revocation checks.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#315f6e"/></marker></defs>
  <rect width="1200" height="720" rx="36" fill="#f4efe7"/><rect x="44" y="38" width="1112" height="54" rx="27" fill="#1e3440"/><text x="600" y="72" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">ORIGINAL COURSE DIAGRAM · NOT PRODUCT UI</text>
  <rect x="82" y="260" width="250" height="174" rx="28" fill="#1e3440"/><text x="207" y="328" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="26" font-weight="780">TOOL</text><text x="207" y="368" text-anchor="middle" fill="#cbd7dc" font-family="system-ui,sans-serif" font-size="17">described capability</text>
  <path d="M332 347 H420" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="system-ui,sans-serif">
    <rect x="440" y="154" width="300" height="88" rx="20" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="476" y="208" fill="#173d37" font-size="21" font-weight="740">READ SCOPE</text>
    <rect x="440" y="262" width="300" height="88" rx="20" fill="#f8dfc3" stroke="#bd6f36" stroke-width="3"/><text x="476" y="316" fill="#633618" font-size="21" font-weight="740">WRITE SCOPE</text>
    <rect x="440" y="370" width="300" height="88" rx="20" fill="#eadff0" stroke="#76528a" stroke-width="3"/><text x="476" y="424" fill="#4e3260" font-size="21" font-weight="740">INHERITED ACCESS</text>
    <rect x="440" y="478" width="300" height="88" rx="20" fill="#dce5f5" stroke="#4f6fa7" stroke-width="3"/><text x="476" y="532" fill="#294166" font-size="21" font-weight="740">LOG AND REVOKE</text>
  </g>
  <path d="M760 360 H838" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="858" y="238" width="270" height="244" rx="28" fill="#fff" stroke="#1e3440" stroke-width="4"/><text x="993" y="300" text-anchor="middle" fill="#1e3440" font-family="system-ui,sans-serif" font-size="24" font-weight="780">DECISION</text><text x="993" y="352" text-anchor="middle" fill="#2d7768" font-family="system-ui,sans-serif" font-size="20" font-weight="720">allow minimum</text><line x1="914" y1="376" x2="1072" y2="376" stroke="#c9beb0" stroke-width="2"/><text x="993" y="420" text-anchor="middle" fill="#a74c46" font-family="system-ui,sans-serif" font-size="20" font-weight="720">or do not connect</text>
  <text x="600" y="640" text-anchor="middle" fill="#435761" font-family="system-ui,sans-serif" font-size="18" font-weight="650">Capability is not blanket authorisation.</text>
</svg>
