<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Bounded delegation envelope</title>
  <desc id="desc">An original course diagram surrounds a delegated task with allowed files, checkpoints, approvals, stop conditions, and rollback evidence.</desc>
  <rect width="1200" height="720" rx="36" fill="#f4efe7"/><rect x="44" y="38" width="1112" height="54" rx="27" fill="#1e3440"/><text x="600" y="72" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">ORIGINAL COURSE DIAGRAM · NOT PRODUCT UI</text>
  <rect x="166" y="150" width="868" height="476" rx="54" fill="#fff" stroke="#1e3440" stroke-width="5" stroke-dasharray="14 10"/>
  <rect x="424" y="284" width="352" height="188" rx="32" fill="#dce5f5" stroke="#4f6fa7" stroke-width="4"/><text x="600" y="351" text-anchor="middle" fill="#294166" font-family="system-ui,sans-serif" font-size="28" font-weight="780">DELEGATED TASK</text><text x="600" y="391" text-anchor="middle" fill="#40577b" font-family="system-ui,sans-serif" font-size="18">observable outcome</text><text x="600" y="424" text-anchor="middle" fill="#40577b" font-family="system-ui,sans-serif" font-size="18">limited workspace</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="212" y="188" width="240" height="92" rx="22" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="332" y="244" fill="#173d37" font-size="20" font-weight="740">ALLOWED FILES</text>
    <rect x="748" y="188" width="240" height="92" rx="22" fill="#f8dfc3" stroke="#bd6f36" stroke-width="3"/><text x="868" y="244" fill="#633618" font-size="20" font-weight="740">APPROVAL GATES</text>
    <rect x="212" y="498" width="240" height="92" rx="22" fill="#eadff0" stroke="#76528a" stroke-width="3"/><text x="332" y="554" fill="#4e3260" font-size="20" font-weight="740">CHECKPOINTS</text>
    <rect x="748" y="498" width="240" height="92" rx="22" fill="#f3d5d2" stroke="#a74c46" stroke-width="3"/><text x="868" y="554" fill="#672f2b" font-size="20" font-weight="740">STOP · ROLLBACK</text>
  </g>
  <path d="M452 260 L486 304M748 260 L714 304M452 518 L486 452M748 518 L714 452" stroke="#315f6e" stroke-width="4"/>
  <text x="600" y="672" text-anchor="middle" fill="#435761" font-family="system-ui,sans-serif" font-size="18" font-weight="650">Delegation expands execution, never accountability.</text>
</svg>
