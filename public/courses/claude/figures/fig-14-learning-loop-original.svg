<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Educator-controlled learning loop</title>
  <desc id="desc">An original course diagram places learner effort and evidence inside a cycle designed and reviewed by an educator.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#315f6e"/></marker></defs>
  <rect width="1200" height="720" rx="36" fill="#f4efe7"/><rect x="44" y="38" width="1112" height="54" rx="27" fill="#1e3440"/><text x="600" y="72" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">ORIGINAL COURSE DIAGRAM · NOT PRODUCT UI</text>
  <circle cx="600" cy="376" r="226" fill="#fff" stroke="#c9beb0" stroke-width="3"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="472" y="128" width="256" height="100" rx="22" fill="#dce5f5" stroke="#4f6fa7" stroke-width="3"/><text x="600" y="170" fill="#294166" font-size="22" font-weight="760">LEARNING GOAL</text><text x="600" y="201" fill="#40577b" font-size="15">teacher defines</text>
    <rect x="818" y="326" width="256" height="100" rx="22" fill="#eadff0" stroke="#76528a" stroke-width="3"/><text x="946" y="368" fill="#4e3260" font-size="22" font-weight="760">PRACTICE</text><text x="946" y="399" fill="#624675" font-size="15">learner attempts</text>
    <rect x="472" y="524" width="256" height="100" rx="22" fill="#f8dfc3" stroke="#bd6f36" stroke-width="3"/><text x="600" y="566" fill="#633618" font-size="22" font-weight="760">EVIDENCE</text><text x="600" y="597" fill="#72482d" font-size="15">show thinking</text>
    <rect x="126" y="326" width="256" height="100" rx="22" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="254" y="368" fill="#173d37" font-size="22" font-weight="760">REVIEW</text><text x="254" y="399" fill="#31584f" font-size="15">teacher verifies</text>
  </g>
  <path d="M728 178 C844 212 909 263 935 313" fill="none" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/><path d="M946 426 C913 496 824 553 742 570" fill="none" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/><path d="M472 574 C386 551 300 494 265 440" fill="none" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/><path d="M254 326 C285 259 374 200 458 181" fill="none" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="600" y="365" text-anchor="middle" fill="#1e3440" font-family="system-ui,sans-serif" font-size="27" font-weight="780">FEEDBACK</text><text x="600" y="402" text-anchor="middle" fill="#526872" font-family="system-ui,sans-serif" font-size="17">supports the next attempt</text>
</svg>
