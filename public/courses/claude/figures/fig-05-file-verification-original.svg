<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Generated-file verification pipeline</title>
  <desc id="desc">An original course diagram shows source inputs becoming a native file that must be opened, checked, and approved before sharing.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#315f6e"/></marker></defs>
  <rect width="1200" height="720" rx="36" fill="#f4efe7"/><rect x="44" y="38" width="1112" height="54" rx="27" fill="#1e3440"/><text x="600" y="72" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">ORIGINAL COURSE DIAGRAM · NOT PRODUCT UI</text>
  <text x="600" y="156" text-anchor="middle" fill="#1e3440" font-family="system-ui,sans-serif" font-size="32" font-weight="780">PREVIEW IS NOT VERIFICATION</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="54" y="264" width="190" height="160" rx="22" fill="#dce5f5" stroke="#4f6fa7" stroke-width="3"/><text x="149" y="320" fill="#294166" font-size="22" font-weight="750">SOURCE</text><text x="149" y="355" fill="#40577b" font-size="16">facts and files</text>
    <rect x="288" y="264" width="190" height="160" rx="22" fill="#eadff0" stroke="#76528a" stroke-width="3"/><text x="383" y="320" fill="#4e3260" font-size="22" font-weight="750">GENERATE</text><text x="383" y="355" fill="#624675" font-size="16">draft object</text>
    <rect x="522" y="264" width="190" height="160" rx="22" fill="#f8dfc3" stroke="#bd6f36" stroke-width="3"/><text x="617" y="310" fill="#633618" font-size="22" font-weight="750">NATIVE FILE</text><text x="617" y="345" fill="#72482d" font-size="16">DOCX · XLSX</text><text x="617" y="374" fill="#72482d" font-size="16">PPTX · PDF</text>
    <rect x="756" y="264" width="190" height="160" rx="22" fill="#fff" stroke="#1e3440" stroke-width="4"/><text x="851" y="310" fill="#1e3440" font-size="22" font-weight="750">OPEN</text><text x="851" y="345" fill="#526872" font-size="16">render · inspect</text><text x="851" y="374" fill="#526872" font-size="16">recalculate</text>
    <rect x="990" y="264" width="156" height="160" rx="22" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="1068" y="320" fill="#173d37" font-size="22" font-weight="750">SHARE</text><text x="1068" y="355" fill="#31584f" font-size="16">after approval</text>
  </g>
  <path d="M244 344 H274M478 344 H508M712 344 H742M946 344 H976" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="196" y="520" width="808" height="86" rx="26" fill="#fff" stroke="#c9beb0" stroke-width="2"/><text x="600" y="555" text-anchor="middle" fill="#435761" font-family="system-ui,sans-serif" font-size="18" font-weight="700">CHECK RECEIPT</text><text x="600" y="584" text-anchor="middle" fill="#526872" font-family="system-ui,sans-serif" font-size="16">format · formulas · links · accessibility · sensitive content</text>
</svg>
