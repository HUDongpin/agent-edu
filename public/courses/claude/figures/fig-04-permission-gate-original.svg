<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Minimum-permission gate</title>
  <desc id="desc">An original course diagram separates a task request from data scope, security review, and a least-privilege decision.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#315f6e"/></marker></defs>
  <rect width="1200" height="720" rx="36" fill="#f4efe7"/><rect x="44" y="38" width="1112" height="54" rx="27" fill="#1e3440"/><text x="600" y="72" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">ORIGINAL COURSE DIAGRAM · NOT PRODUCT UI</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="70" y="268" width="230" height="150" rx="24" fill="#dce5f5" stroke="#4f6fa7" stroke-width="3"/><text x="185" y="323" fill="#294166" font-size="23" font-weight="760">REQUEST</text><text x="185" y="360" fill="#40577b" font-size="17">what action?</text>
    <rect x="362" y="268" width="230" height="150" rx="24" fill="#fff" stroke="#1e3440" stroke-width="4"/><text x="477" y="313" fill="#1e3440" font-size="23" font-weight="760">SCOPE</text><text x="477" y="350" fill="#526872" font-size="17">which files?</text><text x="477" y="380" fill="#526872" font-size="17">read or write?</text>
    <polygon points="760,246 858,343 760,440 662,343" fill="#f8dfc3" stroke="#bd6f36" stroke-width="4"/><text x="760" y="328" fill="#633618" font-size="21" font-weight="760">REVIEW</text><text x="760" y="357" fill="#72482d" font-size="16">risk and need</text>
    <rect x="920" y="184" width="220" height="122" rx="24" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="1030" y="233" fill="#173d37" font-size="22" font-weight="760">MINIMUM</text><text x="1030" y="266" fill="#31584f" font-size="16">allow once</text>
    <rect x="920" y="390" width="220" height="122" rx="24" fill="#f3d5d2" stroke="#a74c46" stroke-width="3"/><text x="1030" y="439" fill="#672f2b" font-size="22" font-weight="760">DENY</text><text x="1030" y="472" fill="#7c413c" font-size="16">or redesign</text>
  </g>
  <path d="M300 343 H348" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/><path d="M592 343 H648" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/><path d="M831 288 C863 254 886 245 906 245" fill="none" stroke="#2d7768" stroke-width="5" marker-end="url(#arrow)"/><path d="M831 398 C864 436 886 450 906 450" fill="none" stroke="#a74c46" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="160" y="566" width="880" height="66" rx="28" fill="#fff" stroke="#c9beb0" stroke-width="2"/><text x="600" y="607" text-anchor="middle" fill="#435761" font-family="system-ui,sans-serif" font-size="18" font-weight="650">File creation and network access are separate decisions.</text>
</svg>
