<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Publication boundary checklist</title>
  <desc id="desc">An original course diagram places an artifact behind checks for context, audience, links, sensitive content, and explicit human approval.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#315f6e"/></marker></defs>
  <rect width="1200" height="720" rx="36" fill="#f4efe7"/><rect x="44" y="38" width="1112" height="54" rx="27" fill="#1e3440"/><text x="600" y="72" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">ORIGINAL COURSE DIAGRAM · NOT PRODUCT UI</text>
  <rect x="70" y="238" width="250" height="220" rx="28" fill="#dce5f5" stroke="#4f6fa7" stroke-width="4"/><text x="195" y="308" text-anchor="middle" fill="#294166" font-family="system-ui,sans-serif" font-size="26" font-weight="780">ARTIFACT</text><path d="M135 340 H255M135 374 H255M135 408 H220" stroke="#7084a5" stroke-width="10" stroke-linecap="round"/>
  <path d="M320 348 H406" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="430" y="148" width="350" height="410" rx="30" fill="#fff" stroke="#1e3440" stroke-width="4"/><text x="605" y="203" text-anchor="middle" fill="#1e3440" font-family="system-ui,sans-serif" font-size="25" font-weight="780">PUBLICATION CHECK</text>
  <g font-family="system-ui,sans-serif" font-size="18" fill="#435761"><circle cx="485" cy="264" r="15" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="520" y="271">exact object and context</text><circle cx="485" cy="326" r="15" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="520" y="333">audience and discoverability</text><circle cx="485" cy="388" r="15" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="520" y="395">links and embedded access</text><circle cx="485" cy="450" r="15" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="520" y="457">sensitive-content scan</text><circle cx="485" cy="512" r="15" fill="#f8dfc3" stroke="#bd6f36" stroke-width="3"/><text x="520" y="519">named human approval</text></g>
  <path d="M780 348 H846" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="870" y="198" width="260" height="126" rx="24" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="1000" y="250" fill="#173d37" font-size="23" font-weight="760">PUBLISH</text><text x="1000" y="285" fill="#31584f" font-size="16">record the receipt</text><rect x="870" y="390" width="260" height="126" rx="24" fill="#f3d5d2" stroke="#a74c46" stroke-width="3"/><text x="1000" y="442" fill="#672f2b" font-size="23" font-weight="760">STOP</text><text x="1000" y="477" fill="#7c413c" font-size="16">remove or redesign</text></g>
  <text x="600" y="642" text-anchor="middle" fill="#435761" font-family="system-ui,sans-serif" font-size="18" font-weight="650">Preview, share, and publish are different exposure decisions.</text>
</svg>
