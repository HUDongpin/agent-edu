<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Task-to-surface decision map</title>
  <desc id="desc">An original course diagram maps a bounded task to Chat, Cowork, or Code according to context and execution needs.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#315f6e"/></marker></defs>
  <rect width="1200" height="720" rx="36" fill="#f4efe7"/>
  <rect x="44" y="38" width="1112" height="54" rx="27" fill="#1e3440"/>
  <text x="600" y="72" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">ORIGINAL COURSE DIAGRAM · NOT PRODUCT UI</text>
  <rect x="440" y="142" width="320" height="128" rx="24" fill="#fff" stroke="#1e3440" stroke-width="4"/>
  <text x="600" y="190" text-anchor="middle" fill="#1e3440" font-family="system-ui,sans-serif" font-size="25" font-weight="750">BOUNDED TASK</text>
  <text x="600" y="229" text-anchor="middle" fill="#526872" font-family="system-ui,sans-serif" font-size="18">outcome · inputs · risk · authority</text>
  <path d="M520 270 C430 330 280 330 230 396" fill="none" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M600 270 V396" fill="none" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M680 270 C770 330 920 330 970 396" fill="none" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="72" y="410" width="316" height="174" rx="24" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/>
    <text x="230" y="460" fill="#173d37" font-size="25" font-weight="750">CHAT</text><text x="230" y="500" fill="#31584f" font-size="18">conversation and review</text><text x="230" y="536" fill="#31584f" font-size="16">human executes final action</text>
    <rect x="442" y="410" width="316" height="174" rx="24" fill="#f8dfc3" stroke="#bd6f36" stroke-width="3"/>
    <text x="600" y="460" fill="#633618" font-size="25" font-weight="750">COWORK</text><text x="600" y="500" fill="#72482d" font-size="18">bounded files and steps</text><text x="600" y="536" fill="#72482d" font-size="16">checkpoints before effects</text>
    <rect x="812" y="410" width="316" height="174" rx="24" fill="#dce5f5" stroke="#4f6fa7" stroke-width="3"/>
    <text x="970" y="460" fill="#294166" font-size="25" font-weight="750">CODE</text><text x="970" y="500" fill="#40577b" font-size="18">repository and tests</text><text x="970" y="536" fill="#40577b" font-size="16">diff before merge or deploy</text>
  </g>
  <rect x="244" y="626" width="712" height="48" rx="24" fill="#fff" stroke="#c9beb0" stroke-width="2"/>
  <text x="600" y="657" text-anchor="middle" fill="#435761" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Choose the smallest surface that can produce inspectable evidence.</text>
</svg>
