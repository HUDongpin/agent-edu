<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Outcome contract diagram</title>
  <desc id="desc">An original course diagram shows a prompt contract built from an outcome, inputs, constraints, and acceptance checks.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#315f6e"/></marker></defs>
  <rect width="1200" height="720" rx="36" fill="#f4efe7"/>
  <rect x="44" y="38" width="1112" height="54" rx="27" fill="#1e3440"/><text x="600" y="72" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">ORIGINAL COURSE DIAGRAM · NOT PRODUCT UI</text>
  <text x="600" y="150" text-anchor="middle" fill="#1e3440" font-family="system-ui,sans-serif" font-size="34" font-weight="780">MAKE THE OUTCOME TESTABLE</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="70" y="236" width="230" height="170" rx="22" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="185" y="290" fill="#173d37" font-size="24" font-weight="750">OUTCOME</text><text x="185" y="330" fill="#31584f" font-size="17">what exists</text><text x="185" y="361" fill="#31584f" font-size="17">when done</text>
    <rect x="350" y="236" width="230" height="170" rx="22" fill="#dce5f5" stroke="#4f6fa7" stroke-width="3"/><text x="465" y="290" fill="#294166" font-size="24" font-weight="750">INPUTS</text><text x="465" y="330" fill="#40577b" font-size="17">allowed sources</text><text x="465" y="361" fill="#40577b" font-size="17">and missing facts</text>
    <rect x="630" y="236" width="230" height="170" rx="22" fill="#f8dfc3" stroke="#bd6f36" stroke-width="3"/><text x="745" y="290" fill="#633618" font-size="24" font-weight="750">CONSTRAINTS</text><text x="745" y="330" fill="#72482d" font-size="17">format · limits</text><text x="745" y="361" fill="#72482d" font-size="17">safety · authority</text>
    <rect x="910" y="236" width="230" height="170" rx="22" fill="#eadff0" stroke="#76528a" stroke-width="3"/><text x="1025" y="290" fill="#4e3260" font-size="24" font-weight="750">CHECKS</text><text x="1025" y="330" fill="#624675" font-size="17">observable tests</text><text x="1025" y="361" fill="#624675" font-size="17">and stop rules</text>
  </g>
  <path d="M185 420 V478 H1025 V420" fill="none" stroke="#315f6e" stroke-width="5"/>
  <path d="M600 478 V535" fill="none" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="340" y="548" width="520" height="96" rx="24" fill="#fff" stroke="#1e3440" stroke-width="4"/>
  <text x="600" y="590" text-anchor="middle" fill="#1e3440" font-family="system-ui,sans-serif" font-size="25" font-weight="780">REVIEWABLE TASK CONTRACT</text><text x="600" y="622" text-anchor="middle" fill="#526872" font-family="system-ui,sans-serif" font-size="17">a second person can judge completion</text>
</svg>
