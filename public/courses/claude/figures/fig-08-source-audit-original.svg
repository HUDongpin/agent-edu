<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Research claim audit chain</title>
  <desc id="desc">An original course diagram shows retrieval locating a candidate while the primary source, exact locator, and claim-fit check provide evidence.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#315f6e"/></marker></defs>
  <rect width="1200" height="720" rx="36" fill="#f4efe7"/><rect x="44" y="38" width="1112" height="54" rx="27" fill="#1e3440"/><text x="600" y="72" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">ORIGINAL COURSE DIAGRAM · NOT PRODUCT UI</text>
  <text x="600" y="150" text-anchor="middle" fill="#1e3440" font-family="system-ui,sans-serif" font-size="32" font-weight="780">RETRIEVAL LOCATES · SOURCES SUPPORT</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="55" y="250" width="190" height="150" rx="22" fill="#eadff0" stroke="#76528a" stroke-width="3"/><text x="150" y="304" fill="#4e3260" font-size="22" font-weight="760">LOCATE</text><text x="150" y="340" fill="#624675" font-size="16">candidate</text>
    <rect x="280" y="250" width="190" height="150" rx="22" fill="#dce5f5" stroke="#4f6fa7" stroke-width="3"/><text x="375" y="304" fill="#294166" font-size="22" font-weight="760">OPEN</text><text x="375" y="340" fill="#40577b" font-size="16">primary record</text>
    <rect x="505" y="250" width="190" height="150" rx="22" fill="#fff" stroke="#1e3440" stroke-width="4"/><text x="600" y="304" fill="#1e3440" font-size="22" font-weight="760">LOCATOR</text><text x="600" y="340" fill="#526872" font-size="16">page · table · cell</text>
    <rect x="730" y="250" width="190" height="150" rx="22" fill="#f8dfc3" stroke="#bd6f36" stroke-width="3"/><text x="825" y="304" fill="#633618" font-size="22" font-weight="760">VERIFY</text><text x="825" y="340" fill="#72482d" font-size="16">identity and fit</text>
    <rect x="955" y="250" width="190" height="150" rx="22" fill="#d8ebe5" stroke="#2d7768" stroke-width="3"/><text x="1050" y="304" fill="#173d37" font-size="22" font-weight="760">CITE</text><text x="1050" y="340" fill="#31584f" font-size="16">bounded claim</text>
  </g>
  <path d="M245 325 H266M470 325 H491M695 325 H716M920 325 H941" stroke="#315f6e" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="160" y="505" width="880" height="104" rx="26" fill="#fff" stroke="#c9beb0" stroke-width="2"/><text x="600" y="548" text-anchor="middle" fill="#435761" font-family="system-ui,sans-serif" font-size="20" font-weight="750">CLAIM–SOURCE LEDGER</text><text x="600" y="582" text-anchor="middle" fill="#526872" font-family="system-ui,sans-serif" font-size="16">identity · exact support · limitation · access status · correction</text>
</svg>
