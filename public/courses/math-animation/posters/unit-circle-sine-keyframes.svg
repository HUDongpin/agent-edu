<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  id="math-poster"
  width="1536"
  height="1024"
  viewBox="0 0 1536 1024"
  role="img"
  aria-labelledby="poster-title poster-description"
  data-theta-radians="0.7853981633974483"
  data-theta-min="0"
  data-theta-max="6.283185307179586"
  data-samples="129"
>
  <title id="poster-title">One angle drives a unit circle, sine graph, projection, and timeline</title>
  <desc id="poster-description">At theta equals pi over four, the highlighted unit-circle point and sine-graph point share the value sin theta. The sine graph spans zero through two pi on a uniform linear axis with equal positive and negative amplitudes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <radialGradient id="circle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#66e4ff" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#66e4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8ca1c4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8192ac"/>
    </marker>
  </defs>

